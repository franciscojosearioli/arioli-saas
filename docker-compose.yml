# docker-compose.yml
version: '3.9'

networks:
  saas_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  meilisearch_data:

services:

  nginx:
    image: nginx:1.25-alpine
    container_name: saas_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www/html:ro
      - ./apps/loteos:/var/www/loteos:ro
      - ./apps/historias-clinicas:/var/www/historias-clinicas:ro
      - ./apps/tallerpro:/var/www/tallerpro:ro
      - ./apps/turnos:/var/www/turnos:ro
      - ./apps/subastas:/var/www/subastas:ro
      - ./apps/inmobiliarias:/var/www/inmobiliarias:ro
      - ./apps/marketplace:/var/www/marketplace:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
    environment:
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.template
    depends_on:
      - app
      - loteos_app
      - historias_app
      - tallerpro_app
      - turnos_app
      - subastas_app
      - inmobiliarias_app
      - marketplace_app
    networks:
      - saas_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas_app
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-saas_central}
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_HOST=${MAIL_HOST:-mailpit}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - TENANCY_CENTRAL_DOMAINS=${TENANCY_CENTRAL_DOMAINS}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas_horizon
    command: php artisan horizon
    volumes:
      - ./src:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - app
      - redis
    networks:
      - saas_network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: saas_mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE:-saas_central}
      - MYSQL_USER=${DB_USERNAME:-saas_user}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    networks:
      - saas_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - saas_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  loteos_app:
    build:
      context: ./apps/loteos
      dockerfile: Dockerfile
    container_name: saas_loteos
    volumes:
      - ./apps/loteos:/var/www/html
      - ./apps/loteos/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${LOTEOS_APP_KEY}
      - APP_URL=http://loteos.internal
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=loteos_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.127.0.0.1.nip.io}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-http://cliente.127.0.0.1.nip.io}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-http://127.0.0.1.nip.io}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped

  historias_app:
    build:
      context: ./apps/historias-clinicas
      dockerfile: Dockerfile
    container_name: saas_historias
    volumes:
      - ./apps/historias-clinicas:/var/www/html
      - ./apps/historias-clinicas/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${HISTORIAS_APP_KEY}
      - APP_URL=http://historias-clinicas.internal
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=historias_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.127.0.0.1.nip.io}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-http://cliente.127.0.0.1.nip.io}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-http://127.0.0.1.nip.io}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped

  tallerpro_app:
    build:
      context: ./apps/tallerpro
      dockerfile: Dockerfile
    container_name: saas_tallerpro
    volumes:
      - ./apps/tallerpro:/var/www/html
      - ./apps/tallerpro/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${TALLERPRO_APP_KEY}
      - APP_URL=http://tallerpro.internal
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=tallerpro_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.127.0.0.1.nip.io}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-http://cliente.127.0.0.1.nip.io}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-http://127.0.0.1.nip.io}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped

  turnos_app:
    build:
      context: ./apps/turnos
      dockerfile: Dockerfile
    container_name: saas_turnos
    volumes:
      - ./apps/turnos:/var/www/html
      - ./apps/turnos/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${TURNOS_APP_KEY}
      - APP_URL=http://turnos.internal
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=turnos_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.127.0.0.1.nip.io}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-http://cliente.127.0.0.1.nip.io}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-http://127.0.0.1.nip.io}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped

  subastas_app:
    build:
      context: ./apps/subastas
      dockerfile: Dockerfile
    container_name: saas_subastas
    volumes:
      - ./apps/subastas:/var/www/html
      - ./apps/subastas/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${SUBASTAS_APP_KEY}
      - APP_URL=http://subastas.internal
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=subastas_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.127.0.0.1.nip.io}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-http://cliente.127.0.0.1.nip.io}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-http://127.0.0.1.nip.io}
      - REVERB_APP_ID=subastas
      - REVERB_APP_KEY=${SUBASTAS_REVERB_APP_KEY}
      - REVERB_APP_SECRET=${SUBASTAS_REVERB_APP_SECRET}
      - REVERB_HOST=subastas_reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped

  inmobiliarias_app:
    build:
      context: ./apps/inmobiliarias
      dockerfile: Dockerfile
    container_name: saas_inmobiliarias
    volumes:
      - ./apps/inmobiliarias:/var/www/html
      - ./apps/inmobiliarias/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${INMOBILIARIAS_APP_KEY}
      - APP_URL=http://inmobiliarias.internal
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=inmobiliarias_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - TENANCY_CENTRAL_DOMAINS=inmobiliarias.internal,${SAAS_ADMIN_HOST:-admin.127.0.0.1.nip.io}
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.127.0.0.1.nip.io}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-http://cliente.127.0.0.1.nip.io}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-http://127.0.0.1.nip.io}
      # marketplace_app solo habla FastCGI (php-fpm, puerto 9000) — hay
      # que pasar por nginx, que resuelve el vhost correcto por Host header.
      - MARKETPLACE_API_URL=http://nginx
      - MARKETPLACE_API_HOST=marketplace.internal
      - MARKETPLACE_API_TOKEN=${MARKETPLACE_API_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped

  # §01/§08: servicio de solo-lectura pública, base propia, nunca accede
  # directo a la base de un tenant — solo se entera de cambios vía la API
  # interna que llaman los ChannelAdapter de cada tenant.
  marketplace_app:
    build:
      context: ./apps/marketplace
      dockerfile: Dockerfile
    container_name: saas_marketplace
    volumes:
      - ./apps/marketplace:/var/www/html
      - ./apps/marketplace/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${MARKETPLACE_APP_KEY}
      - APP_URL=http://marketplace.internal
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=marketplace
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SCOUT_DRIVER=meilisearch
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILISEARCH_KEY}
      - MARKETPLACE_API_TOKEN=${MARKETPLACE_API_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - saas_network
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: saas_meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY}
      - MEILI_ENV=${APP_ENV:-development}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - saas_network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: saas_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - saas_network
    restart: unless-stopped