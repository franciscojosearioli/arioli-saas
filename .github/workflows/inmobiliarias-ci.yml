name: Inmobiliarias CI

on:
  push:
    branches: [master, main]
    paths:
      - "apps/inmobiliarias/**"
      - ".github/workflows/inmobiliarias-ci.yml"
  pull_request:
    paths:
      - "apps/inmobiliarias/**"
      - ".github/workflows/inmobiliarias-ci.yml"

defaults:
  run:
    working-directory: apps/inmobiliarias

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, zip, gd, bcmath, intl, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: apps/inmobiliarias/vendor
          key: composer-${{ hashFiles('apps/inmobiliarias/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        # npm install en vez de npm ci: todavía no hay package-lock.json
        # committeado (se generó este proyecto sin Node disponible en la
        # máquina de desarrollo). Cambiar a npm ci en cuanto se commitee el
        # lockfile, para builds reproducibles.
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test
