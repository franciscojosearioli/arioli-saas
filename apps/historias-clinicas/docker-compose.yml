version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aav_app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: centroap_aav
      DB_USERNAME: aav_user
      DB_PASSWORD: secret
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_ENCRYPTION: null
    networks:
      - aav_network
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: aav_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - aav_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: aav_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: centroap_aav
      MYSQL_USER: aav_user
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - aav_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  node:
    image: node:20-alpine
    container_name: aav_node
    working_dir: /var/www
    volumes:
      - .:/var/www
      - node_modules_cache:/var/www/node_modules
    command: sh -c "npm install && npm run build"
    profiles:
      - build

  mailpit:
    image: axllent/mailpit:latest
    container_name: aav_mailpit
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - aav_network

networks:
  aav_network:
    driver: bridge

volumes:
  mysql_data:
  vendor_cache:
  storage_data:
  cache_data:
  node_modules_cache:
