    environment:
      - APP_ENV=production
      - APP_KEY=${HISTORIAS_APP_KEY}
      - APP_URL=https://clinica.arioli.dev
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=historias_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.arioli.dev}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-https://cliente.arioli.dev}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-https://arioli.dev}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped
    extra_hosts:
      - "mail.arioli.dev:host-gateway"

  historias_scheduler:
    build:
      context: ./apps/historias-clinicas
      dockerfile: Dockerfile
    container_name: saas_historias_scheduler
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./apps/historias-clinicas:/var/www/html
      - ./apps/historias-clinicas/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_KEY=${HISTORIAS_APP_KEY}
      - APP_URL=https://clinica.arioli.dev
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=historias_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.arioli.dev}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-https://cliente.arioli.dev}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-https://arioli.dev}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped
    extra_hosts:
      - "mail.arioli.dev:host-gateway"

  tallerpro_app:
    build:
      context: ./apps/tallerpro
      dockerfile: Dockerfile
    container_name: saas_tallerpro
    volumes:
      - ./apps/tallerpro:/var/www/html
      - ./apps/tallerpro/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_KEY=${TALLERPRO_APP_KEY}
      - APP_URL=https://servis.arioli.dev
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=tallerpro_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.arioli.dev}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-https://cliente.arioli.dev}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-https://arioli.dev}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped
    extra_hosts:
      - "mail.arioli.dev:host-gateway"

  turnos_app:
    build:
      context: ./apps/turnos
      dockerfile: Dockerfile
    container_name: saas_turnos
    volumes:
      - ./apps/turnos:/var/www/html
      - ./apps/turnos/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_KEY=${TURNOS_APP_KEY}
      - APP_URL=https://turnos.arioli.dev
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=turnos_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.arioli.dev}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-https://cliente.arioli.dev}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-https://arioli.dev}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped
    extra_hosts:
      - "mail.arioli.dev:host-gateway"

  subastas_app:
    build:
      context: ./apps/subastas
      dockerfile: Dockerfile
    container_name: saas_subastas
    volumes:
      - ./apps/subastas:/var/www/html
      - ./apps/subastas/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_KEY=${SUBASTAS_APP_KEY}
      - APP_URL=https://subastas.arioli.dev
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=subastas_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.arioli.dev}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-https://cliente.arioli.dev}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-https://arioli.dev}
      - REVERB_APP_ID=subastas
      - REVERB_APP_KEY=${SUBASTAS_REVERB_APP_KEY}
      - REVERB_APP_SECRET=${SUBASTAS_REVERB_APP_SECRET}
      - REVERB_HOST=subastas_reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped
    extra_hosts:
      - "mail.arioli.dev:host-gateway"

  chatia_app:
    build:
      context: ./apps/chatia
      dockerfile: Dockerfile
    container_name: saas_chatia
    volumes:
      - ./apps/chatia:/var/www/html
      - ./apps/chatia/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_KEY=${CHATIA_APP_KEY}
      - APP_URL=https://chatia.arioli.dev
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=chatia_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.arioli.dev}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-https://cliente.arioli.dev}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-https://arioli.dev}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped
    extra_hosts:
      - "mail.arioli.dev:host-gateway"

  # Servidor WebSocket dedicado (Módulo 3 — pujas en tiempo real, ver
  # propuesta_subastas_judiciales.pdf §3). Corre `reverb:start` como proceso
  # de larga duración, separado del contenedor PHP-FPM que atiende HTTP.
  subastas_reverb:
    build:
      context: ./apps/subastas
      dockerfile: Dockerfile
    container_name: saas_subastas_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./apps/subastas:/var/www/html
      - ./apps/subastas/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_KEY=${SUBASTAS_APP_KEY}
      - APP_URL=https://subastas.arioli.dev
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=subastas_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REVERB_APP_ID=subastas
      - REVERB_APP_KEY=${SUBASTAS_REVERB_APP_KEY}
      - REVERB_APP_SECRET=${SUBASTAS_REVERB_APP_SECRET}
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped

  inmobiliarias_app:
    build:
      context: ./apps/inmobiliarias
      dockerfile: Dockerfile
    container_name: saas_inmobiliarias
    volumes:
      - ./apps/inmobiliarias:/var/www/html
      - ./apps/inmobiliarias/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_KEY=${INMOBILIARIAS_APP_KEY}
      - APP_URL=https://inmobiliarias.arioli.dev
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=inmobiliarias_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - TENANCY_CENTRAL_DOMAINS=inmobiliarias.internal,${SAAS_ADMIN_HOST:-admin.arioli.dev}
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.arioli.dev}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-https://cliente.arioli.dev}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-https://arioli.dev}
      - MARKETPLACE_API_URL=http://nginx
      - MARKETPLACE_API_HOST=marketplace.arioli.dev
      - MARKETPLACE_API_TOKEN=${MARKETPLACE_API_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped
    extra_hosts:
      - "mail.arioli.dev:host-gateway"

  inmobiliarias_scheduler:
    build:
      context: ./apps/inmobiliarias
      dockerfile: Dockerfile
    container_name: saas_inmobiliarias_scheduler
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./apps/inmobiliarias:/var/www/html
      - ./apps/inmobiliarias/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_KEY=${INMOBILIARIAS_APP_KEY}
      - APP_URL=https://inmobiliarias.arioli.dev
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=inmobiliarias_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      # El que corre publicaciones:sincronizar de verdad es este contenedor.
      - MARKETPLACE_API_URL=http://nginx
      - MARKETPLACE_API_HOST=marketplace.arioli.dev
      - MARKETPLACE_API_TOKEN=${MARKETPLACE_API_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped
    extra_hosts:
      - "mail.arioli.dev:host-gateway"

  inmobiliarias_horizon:
    build:
      context: ./apps/inmobiliarias
      dockerfile: Dockerfile
    container_name: saas_inmobiliarias_horizon
    command: php artisan horizon
    volumes:
      - ./apps/inmobiliarias:/var/www/html
      - ./apps/inmobiliarias/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_KEY=${INMOBILIARIAS_APP_KEY}
      - DB_HOST=mysql
      - DB_DATABASE=inmobiliarias_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped
    extra_hosts:
      - "mail.arioli.dev:host-gateway"

  # §01/§08: servicio de solo-lectura pública, base propia, nunca accede
  # directo a la base de un tenant.
  marketplace_app:
    build:
      context: ./apps/marketplace
      dockerfile: Dockerfile
    container_name: saas_marketplace
    volumes:
      - ./apps/marketplace:/var/www/html
      - ./apps/marketplace/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_KEY=${MARKETPLACE_APP_KEY}
      - APP_URL=https://marketplace.arioli.dev
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=marketplace
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILISEARCH_KEY}
      - MARKETPLACE_API_TOKEN=${MARKETPLACE_API_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - saas_network
    restart: unless-stopped
    extra_hosts:
      - "mail.arioli.dev:host-gateway"

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: saas_meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - saas_network
    restart: unless-stopped

  # Cierre automático de subastas vencidas + extensión del "minuto de ley"
  # (Módulos 3-4, ver propuesta_subastas_judiciales.pdf §2.1).
  subastas_scheduler:
    build:
      context: ./apps/subastas
      dockerfile: Dockerfile
    container_name: saas_subastas_scheduler
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./apps/subastas:/var/www/html
      - ./apps/subastas/docker-php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_KEY=${SUBASTAS_APP_KEY}
      - APP_URL=https://subastas.arioli.dev
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=subastas_default
      - DB_USERNAME=${DB_USERNAME:-saas_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_DRIVER=file
      - CACHE_STORE=redis
      - SAAS_API_URL=http://nginx/api/license/validate
      - SAAS_VERSION_URL=http://nginx/api/app/version
      - SAAS_UPDATE_URL=http://nginx/api/app/update
      - SAAS_INFO_URL=http://nginx/api/license/info
      - SAAS_API_TOKEN=${API_LICENSE_SECRET}
      - SAAS_ADMIN_HOST=${SAAS_ADMIN_HOST:-admin.arioli.dev}
      - SAAS_CLIENT_URL=${SAAS_CLIENT_URL:-https://cliente.arioli.dev}
      - SAAS_LANDING_URL=${SAAS_LANDING_URL:-https://arioli.dev}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network
    restart: unless-stopped
    extra_hosts:
      - "mail.arioli.dev:host-gateway"
